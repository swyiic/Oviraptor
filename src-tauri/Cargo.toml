[package]
name = "oviraptor"
version = "1.1.59"
description = "Cross-platform enterprise asset inventory and review desktop application"
authors = ["Oviraptor"]
edition = "2021"
default-run = "oviraptor"

[features]
import-tools = []

[[bin]]
name = "import-existing-results"
path = "../tools/import_existing_results.rs"
required-features = ["import-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oviraptor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.23.5", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
brotli = "8"
flate2 = "1"
regex = "1"
rustls = { version = "=0.23.35", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "=0.6.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "socks", "gzip", "brotli", "deflate", "charset"] }
# Model transport only: a private current-thread runtime per request so a cancel
# drops the in-flight future instead of leaving a detached worker on the wire.
tokio = { version = "1.52.3", features = ["rt", "time", "net", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
