name: Workflow reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
      OVIRAPTOR_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:app-packages
      - run: npx vue-tsc --noEmit
      - run: npm run test:ui
      - run: npm run test:agent-first
  native-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMPDIR: /tmp
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib asset_discovery::
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib jobs::
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib certificates::
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::application_overview::
