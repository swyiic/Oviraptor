name: Workflow reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
      OVIRAPTOR_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:app-packages
      - run: npx vue-tsc --noEmit
      - run: npm run test:ui
      - name: Verify read-only seed cleanup reports
        run: python3 tools/qa/project-seeds/test-cleanup-report.py
      - run: npm run test:agent-first
  macos-execution:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:app-packages
      # Exercise the whole Host/SDK/app surface on macOS as well as Linux;
      # sandbox-exec and Python output isolation are platform-specific.
      - name: Verify macOS Agent, SDK and applications
        run: npm run test:agent-first
      - name: Verify macOS build receipts
        run: node --test tools/test_build_receipt.cjs
  native-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMPDIR: /tmp
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded Ubuntu native dependencies
        timeout-minutes: 9
        run: bash tools/install_ci_native_deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib asset_discovery::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib jobs::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib certificates::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::chat_files::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::application_overview::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::exposure::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib certificate_bridge::'
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib asset_service::exposure_service::'
      - name: Verify scan evidence delivery and recovery boundaries
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib scanning::agent_channel::
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib specialist_redaction_receipt
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib specialist_recovery
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib web_recovery_
