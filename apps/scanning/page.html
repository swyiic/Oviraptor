<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>扫描任务通道</title><style>body{font:15px system-ui;margin:24px;line-height:1.7;max-width:68ch;color:#292929}h1{font-size:24px}section{border:1px solid #e5e5e5;border-radius:12px;padding:16px 20px;margin:16px 0}small{color:#666}code{background:#f3f3f3;padding:2px 5px;border-radius:4px}</style><h1>扫描任务通道</h1><section><h2>桌面扫描工作台</h2><p>Agent 可通过当前项目读取真实任务与进度，将已保存资产交接为原生草稿，并在取得对应权限后请求原引擎启动、暂停或恢复。实际任务在扫描工作台中查看。</p><p>草稿、执行和暂停分别授权。原引擎继续检查范围、模型、预算与恢复条件；启动回执不代表任务完成。结果未知时先核对状态。</p></section><section><h2>保留的历史草稿</h2><p>旧 <code>draft_create / task_status / journal_read</code> 工具管理本组件独立保存的旧草稿；这些记录不会自动变成桌面扫描任务，也不会自动执行。</p></section><small>桌面通道仅在受信任的 Host 执行器可用时显示；页面不接收内部凭证或直接调用目标。</small><script>addEventListener('message',event=>{const m=event.data;if(event.source!==parent||!m||m.protocol!=='oviraptor.app-ui.v1'||m.type!=='init'||m.appId!=='org.oviraptor.scanning'||typeof m.nonce!=='string')return;parent.postMessage({protocol:m.protocol,type:'ready',appId:m.appId,nonce:m.nonce},'*');});</script></html>
